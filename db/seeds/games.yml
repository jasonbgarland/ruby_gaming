  summary: 'The Legend of Zelda: Ocarina of Time is the fifth main installment of
    The Legend of Zelda series and the first to be released for the Nintendo 64. It
    was one of the most highly anticipated games of its age, and is listed among the
    greatest video games ever created by numerous websites and magazines. The gameplay
    of Ocarina of Time was revolutionary for its time, it has arguably made more of
    an impact on later games in the series than any of its predecessors even though
    they had the same cores of exploration, dungeons, puzzles and item usage. Among
    the gameplay mechanics, one of the most noteworthy is the time-traveling system.
    The game begins with the player controlling the child Link, but later on an adult
    Link becomes a playable character as well and each of them has certain unique
    abilities. Ocarina of Time also introduces the use of music to solve puzzles:
    as new songs are learned, they can be used to solve puzzles, gain access to new
    areas and warp to different locations. Dungeon exploration is somewhat more puzzle-oriented
    than in earlier games but they are not too complex.'
