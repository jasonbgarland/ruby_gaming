# PostgreSQL for the primary database. Versions 9.3 and up are supported.
#
#   gem install pg
#
#   Ensure the PG gem is defined in your Gemfile
#   gem "pg"
#
primary: &primary
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USERNAME", ENV["USER"]) %>
  password: <%= ENV["DB_PASSWORD"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# SQLite for the Solid Queue/Cache/Cable databases — these are local,
# embedded-friendly workloads that don't need a full Postgres server.
sqlite: &sqlite
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *primary
    database: ruby_gaming_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *primary
    database: ruby_gaming_test

production:
  primary:
    <<: *primary
    database: ruby_gaming_production
    username: <%= ENV.fetch("DB_USERNAME", "ruby_gaming") %>
    password: <%= ENV["RUBY_GAMING_DATABASE_PASSWORD"] %>
  cache:
    <<: *sqlite
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *sqlite
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *sqlite
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
